name: Public release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==3.0.1
      - run: python tests/check_release.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Parse all R source files
        run: Rscript -e 'for (p in list.files("R", pattern="[.]R$", full.names=TRUE)) parse(file=p)'
